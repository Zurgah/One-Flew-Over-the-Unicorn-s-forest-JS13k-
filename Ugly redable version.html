<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Flew Over the Unicorn's forest</title>
<style>
html,body{margin:0;height:100%;background:#050816;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:system-ui;color:#fff;user-select:none}
#stage{position:relative}
canvas{display:block;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,8,20,.72)}
#overlay.hidden{opacity:0;pointer-events:none}
.panel{background:rgba(10,16,40,.93);padding:20px;text-align:center;overflow:auto}
#scoreval{font-size:56px;font-weight:800;color:#ffd75e}
.sub{font-size:22px;color:#cfd6ff;margin:6px 0 14px}
#stats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.stat{padding:8px 10px}
.stat-emoji{font-size:44px}
.stat-count{font-weight:800;font-size:17px;color:#ffd75e}
#hint{color:#8fa0e8;font-size:14px;margin-top:16px}
</style>
</head>
<body>
<div id="stage">
<canvas id="game" width="960" height="540"></canvas>
<div id="overlay" class="hidden">
<div class="panel">
<div id="scoreval">0</div>
<div id="distval" class="sub"></div>
<div id="stats"></div>
<div id="hint">Press any key</div>
</div>
</div>
</div>
<script>
'use strict';
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const EMOJI_FONT='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

const GY=2400,OBJ_TOP=420,CAM_MAX_Y=GY-(H-64),UNI_X=200;
const AIR_FLOOR=GY-450;
const MAX_EN=100;
const ID_RAINBOW=15,ID_CORN=17;

const EMOJI=['🐦','🪶','🌾','🦋','🐝','🌳','☁️','🫧','🪵','✨','🎈','🍄','🪁','🦟','🍇','🌈','️🌩️','🌽','🌠'];
const N=EMOJI.length;
const isGround=[],weight=[],points=[];
for(let id=0;id<N;id++){
 isGround[id]=(id%3==2);
 weight[id]=id%4+1;
 points[id]=50+10*weight[id]+50*id;
}
weight[18]=1;

const airPool=[],groundPool=[];
for(let id=0;id<N;id++){
 if(!isGround[id]&&id!=ID_RAINBOW)airPool.push(id);
 else if(isGround[id]&&id!=ID_CORN)groundPool.push(id);
}
const airPoolNoStar=airPool.filter(id=>id!=18);
const RAINBOW=['#ff5252','#ff9f43','#ffe14d','#63e06b','#4dc3ff','#7a6bff','#d75dff'];

let phase='run';
let uwx=0,uwy=GY-24,camX=-UNI_X,camY=CAM_MAX_Y;
let theta=0,v=0,vy=0,bob=0,holding=false,holdT=0,launchBoost=0,distAcc=0;
let energy=MAX_EN,score=0;
let gameTime=0,deathAt=0,collected={};
let objects=[],parts=[],trail=[],tracks=[],interScanX=0;
let genX=0,shake=0,rainbowChance=1;

const rand=(a,b)=>a+Math.random()*(b-a);
function hashRand(n){return Math.abs(Math.sin(n*127.1+311.7))*43758.5453%1;}
const clampY=y=>Math.min(Math.max(y,OBJ_TOP+24),AIR_FLOOR);

const sprites={};
function getSprite(ch,tint,S){
 S=S||64;
 const key=ch+S+(tint||'');
 if(sprites[key])return sprites[key];
 const c=document.createElement('canvas');c.width=c.height=S;
 const g=c.getContext('2d');
 g.font=S*0.9+'px '+EMOJI_FONT;g.textAlign='center';g.textBaseline='middle';
 g.fillText(ch,S/2,S/2);
 if(tint){g.globalCompositeOperation='source-atop';g.fillStyle=tint;g.fillRect(0,0,S,S);}
 return sprites[key]=c;
}
function drawEmoji(ch,x,y,s,S,tint){ctx.drawImage(getSprite(ch,tint,S),x-s/2,y-s/2,s,s);}
function initSprites(){
 for(let id=0;id<N;id++)if(id!=5)getSprite(EMOJI[id]);
 getSprite('🌳',0,280);
 getSprite('☁️','#ff8cc8cc',280);
}

const UNICORN_SVG=`<svg xmlns="http://www.w3.org/2000/svg" data-guides="{&quot;vertical&quot;:[],&quot;horizontal&quot;:[]}" viewBox="0 0 1104 916"><path id="tSvg1619567a34f" fill="#CD7ED5" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1" d="m1013 155-16 46 55-6-18 51-23 12c3.333 8-36.833 25.81-33.5 33.81 8 11.333 77.753 193.73 64.38 201l-97.32 5.25-44.77-16.18-40.85-12.04-12.88 30.47.05 27.2 33.14 23.93 133.5 52.81 23.13 20.44 24.18 24.97L1075 679l-59.06 33.06-22.06-13.94-52.19 49.69L912 749l-25-24-30.52-24.81L812 683l-45.31-8.94L692 723l-146 24-67.71 63.91L449 820l-35 62-42 25-36-42-21 21-39.81 26.06L249 897l-15-44 18-24 35-84 33.74-95.16L330 598l-88.29 120.18L228 740l-38 41-112-5-54-59 83.44-7.81L51 689l-29-53 13-83 22.5 52.69L161 517l23-26 116.5-21.94L373 527l115-32-68-32-91.94-31.81-24.31 10.06L303 409l54.12-36.81L386 370l-49.56-10.5-61.78 28.34-46.54 4.04-30.5-20.82-4.31-39L224 352l30-4 22-32 19.81-24.19 74.91-25.22L402 271l-7-68 75.44 34.5L530 213l34-44 26-32 37-36 145-50 73 26 32.19-5.12L918 83l24 41"/><path id="tSvgc02eef8948" fill="#ECEFF7" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1" d="m760.63 75.5 55 81v27l64 36 100.88 44.19 93.12 101.81 18 57-29.94 59-39.12 7.62-51.94-37.62 51 42-35 12-51-12-27-9-31.5-11.94-43.5-8.06-41-21-33-54 41 64 35 16-9 119-34-12 31 16 129 76-47 31-19 23-45.62-33.19-94.38-22.81-33-13 29 16-27 31-221 38-3-37-15 34-15.87 22.62-112.13 48.38-44 82-50-50 33.76-82.53 34.98-101.63 7.26-43.84 26-49 18-21 34-19 25-8 26-8 29-2 29-4 25-7 27.62-13.63 31.13-25.81 33.25-27.56 52.33-102.2.55-27.92 31.62-86.69 23.5 12.81-12.75-105.69zl121 229"/><path id="tSvg10e702eab0" fill="#e2d5f5" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1" d="m841 550 35.56 6.04 26.69 6.15L1017 615l21 20-55 48-27-23-78-53-24.44-11.38-15.5-28.37z"/><path id="tSvgc6cd2da5ed" fill="#d9b6f4" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1" d="m482 738 54 7-87 69-42 66-47-44 9.92-25.55z"/><path id="tSvgadea6b133d" fill="#0d0d0d" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1" d="m888.44 290.94 21.31 25-7.63 25.81-41.37 6.19-14-32zl-8.69 25 3-13"/><path id="tSvga8b7aaf120" fill="#F8CA2F" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1" d="M1000 185.5s-49.667-39.333-53-49c5-7.333 148-131.167 153-138.5 6-2-100 187.5-100 187.5"/></svg>`;
function loadUnicorn(){
 return new Promise(res=>{
  const img=new Image();
  img.onload=()=>{
   const c=document.createElement('canvas');c.width=c.height=64;
   c.getContext('2d').drawImage(img,0,0,64,64);
   sprites['🦄64']=c;res();
  };
  img.src='data:image/svg+xml,'+encodeURIComponent(UNICORN_SVG);
 });
}

function skyColor(t){
 t=Math.min(1,Math.max(0,t));
 const u=1-t,a=u*u,b=2*u*t;
 return 'rgb('+(6+a*162+b*34|0)+','+(10+a*210+b*100|0)+','+(36+a*209+b*184|0)+')';
}

function makeTrack(i){
 return{
  baseCenter:778+216*i+rand(-90,90),
  centerA:rand(180,380),centerP:rand(0,6.28),
  baseAmp:rand(120,280),ampP:rand(0,6.28),
  baseW:rand(0.0025,0.005),p0:rand(0,6.28),
  genX:camX+240+i*40};
}
function initTracks(){tracks=[];for(let i=0;i<5;i++)tracks.push(makeTrack(i));}
function trackY(tr,x){
 return clampY(tr.baseCenter+tr.centerA*Math.sin(x*0.0007+tr.centerP)
  +tr.baseAmp*(0.55+0.45*Math.sin(x*0.001+tr.ampP))*Math.sin(x*tr.baseW+tr.p0));
}
function near(x,y,r,f){return objects.some(o=>f(o)&&Math.abs(o.x-x)<r&&(y==null||Math.abs(o.y-y)<r));}
function pickId(pool){
 let s=0;for(const id of pool)s+=weight[id];
 let r=Math.random()*s;
 for(const id of pool){r-=weight[id];if(r<=0)return id;}
}
function pickAir(y){return pickId(y<670?airPool:airPoolNoStar);}
function ensureWorld(){
 const end=camX+W+600,g=camX+W*0.3;
 for(const tr of tracks){
  while(tr.genX<end){
   const x=tr.genX;tr.genX+=360;
   const y=trackY(tr,x);
   if(y<450||near(x,y,80,o=>!o.ground))continue;
   objects.push({id:pickAir(y),x,y,ground:false});
  }
 }
 spawnIntersections();
 if(genX<g)genX=g+rand(0,200);
 while(genX<end){
  if(Math.random()<0.18){spawnCornField(genX);continue;}
  genX+=300*rand(0.8,1.35);
  if(!near(genX,null,170,o=>o.ground))objects.push({id:pickId(groundPool),x:genX,y:2400,ground:true});
 }
}
function spawnIntersections(){
 const T=tracks,n=T.length,target=camX+W+600;
 if(interScanX<camX-100)interScanX=camX-100;
 for(let x=interScanX;x<=target;x+=14){
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
   const a=trackY(T[i],x)-trackY(T[j],x);
   const b=trackY(T[i],x+14)-trackY(T[j],x+14);
   if(a*b<0){
    const xi=x+7,yi=(trackY(T[i],xi)+trackY(T[j],xi))/2;
    if(yi>450&&yi<=1950&&Math.random()<rainbowChance&&!near(xi,yi,160,o=>o.id==15))
     objects.push({id:15,x:xi,y:yi,ground:false});
   }
  }
 }
 interScanX=target;
}
function spawnCornField(x0){
 const count=6+Math.random()*5|0;
 for(let i=0;i<count;i++)objects.push({id:17,x:x0+i*58,y:2400,ground:true});
 genX=x0+count*58+260;
}

function collect(id){
 score+=points[id];
 collected[id]=(collected[id]||0)+1;
 theta=Math.max(-1.15,theta-0.03);
 launchBoost=Math.min(launchBoost+300,600);
}
function die(){
 if(phase!='fly')return;
 phase='dead';deathAt=gameTime;
 holdT=holding=0;
 vy=Math.max(vy,80);shake=9;
 setTimeout(()=>phase=='dead'&&showOverlay(),700);
}
function takeoff(){
 phase='fly';theta=-0.55;v=552;vy=holdT=0;
 launchBoost=800;burstWorld(uwx,uwy);
}
function followCam(dt){
 camX=uwx-200;
 camY+=(Math.max(-260,Math.min(1924,uwy-297))-camY)*Math.min(1,dt*6);
}

function update(dt){
 gameTime+=dt;
 shake=Math.max(0,shake-26*dt);
 updateFx(dt);
 if(phase=='run'){
  uwx+=360*dt;bob+=dt*11;
  uwy=2376+Math.sin(bob)*2.2;
  camX=uwx-200;camY=1924;
  ensureWorld();
 }else if(phase=='dead'){
  if(uwy<2376){vy+=820*dt;uwy+=vy*dt;theta+=4*dt;}else uwy=2376;
  followCam(dt);
 }else{
  theta+=0.1*dt;
  if(holding&&energy>0){
   holdT+=dt;
   theta-=0.62*(2+Math.min(holdT/1.2,1))*dt;
   energy=Math.max(0,energy-11*dt);
  }else holdT=0;
  theta=Math.min(1.25,Math.max(-1.15,theta));
  const s=Math.sin(theta),vT=Math.max(60,480+456*s);
  v=Math.min(820,v+(vT-v)*Math.min(1,(vT>v?2.8:0.8)*dt));
  const dxm=v*Math.cos(theta)*dt;
  uwx+=dxm;
  uwy+=(v*s-launchBoost)*dt;
  launchBoost=Math.max(0,launchBoost-600*dt);
  distAcc+=dxm*0.025;
  distAcc>=1&&(score+=distAcc|0,distAcc%=1);
  if(uwy<60)uwy=60;
  followCam(dt);
  trail.push({wx:uwx,wy:uwy+8,c:RAINBOW[gameTime*14%7|0]});
  ensureWorld();collisions();
  phase=='fly'&&uwy>=2380&&die();
 }
 cull();
}
function collisions(){
 for(const o of objects){
  if(o.dead)continue;
  const dx=o.x-uwx;
  if(dx<-120||dx>120)continue;
  const id=o.id,d2=dx*dx;
  if(id==5){
   if(dx>-33&&dx<33&&uwy>2250){die();return;}
   if(!o.hit&&d2+(uwy-2150)**2<13225){o.hit=true;collect(5);v*=0.9;burstWorld(o.x,2150);}
   continue;
  }
  if(id==11){
   if(dx>-66&&dx<66&&uwy>2305&&uwy<2420){o.dead=true;collect(11);theta=-0.5;launchBoost=Math.max(launchBoost,500);uwy=2370;burstWorld(o.x,2370);}
   continue;
  }
  const oy=o.ground?2378:o.y,dy=oy-uwy;
  if(d2+dy*dy>1764)continue;
  if(id==8){die();return;}
  o.dead=true;burstWorld(o.x,oy);
  if(id==15){collect(15);score-=840;energy=Math.min(100,energy+50);rainbowChance*=0.7;}
  else{collect(id);if(id==16)launchBoost=Math.max(launchBoost,800);}
 }
}
function cull(){objects=objects.filter(o=>!o.dead&&o.x>camX-160);}
function updateFx(dt){
 trail=trail.filter(t=>uwx-t.wx<250&&t.wx-camX>-40);
 parts=parts.filter(p=>{p.wy+=p.vy*dt;return p.wy-camY<H&&p.wx-camX>-40;});
}
function burstWorld(wx,wy){
 for(let i=8;i--;)parts.push({wx:wx+rand(-14,14),wy:wy+rand(-8,8),vy:rand(50,120),r:rand(2,4)});
}

function scenery(){
 const gy=GY-camY;
 const coff=camX*0.5;
 let i0=Math.floor((coff-300)/380),i1=Math.ceil((coff+W+300)/380);
 ctx.globalAlpha=0.5;
 for(let i=i0;i<=i1;i++){
  if(hashRand(i+50)<0.2)continue;
  const sy=520+hashRand(i+101)*1580-camY;
  if(sy<-350||sy>H+350)continue;
  drawEmoji('☁️',i*380-coff+hashRand(i)*260,sy,110+hashRand(i+202)*230,280,'rgba(255,140,200,0.8)');
 }
 if(gy>-200&&gy<H+300){
  const off=camX*0.22;
  i0=Math.floor((off-300)/260);i1=Math.ceil((off+W+300)/260);
  ctx.globalAlpha=0.65;
  for(let i=i0;i<=i1;i++){
   const s=130*(0.6+hashRand(i+7)*0.8);
   drawEmoji('🌳',i*260-off+hashRand(i+11)*156,gy-s*0.4,s,280);
  }
 }
 ctx.globalAlpha=1;
}
function draw(){
 ctx.save();
 ctx.translate(rand(-shake,shake),rand(-shake,shake));
 sky();scenery();ground();
 trailDraw();objectsDraw();unicornDraw();partsDraw();
 ctx.restore();
 hud();
}
function sky(){
 const g=ctx.createLinearGradient(0,0,0,H);
 for(let i=0;i<=4;i++)
  g.addColorStop(i/4,skyColor((GY-camY-H*i/4)/2660));
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const sa=Math.min(1,Math.max(0,((GY-camY-270)/2660-0.35)/0.4));
 if(sa>0.01){
  ctx.fillStyle='#cfe2ff';
  for(let i=0;i<70;i++){
   ctx.globalAlpha=sa*(0.25+0.5*hashRand(i+200));
   ctx.fillRect(hashRand(i)*W,hashRand(i+100)*324,1.6,1.6);
  }
 }
 ctx.globalAlpha=1;
}
function ground(){
 const gy=GY-camY;
 if(gy>H+10)return;
 const g=ctx.createLinearGradient(0,gy,0,gy+80);
 g.addColorStop(0,'#3f9d4e');g.addColorStop(1,'#2a6e38');
 ctx.fillStyle=g;ctx.fillRect(0,gy,W,H-gy+50);
 ctx.fillStyle='#57c264';ctx.fillRect(0,gy,W,5);
 ctx.strokeStyle='#2f7d3c';ctx.lineWidth=2;ctx.beginPath();
 const i0=Math.floor(camX/26);
 for(let i=-1;i<W/26+2;i++){
  const idx=i0+i,sx=idx*26-camX;
  ctx.moveTo(sx,gy+8);ctx.lineTo(sx+3,gy+5-(Math.abs(idx*3)%7));
 }
 ctx.stroke();
}
function trailDraw(){
 for(const t of trail){
  const k=1-(uwx-t.wx)/250;
  if(k<=0)continue;
  ctx.globalAlpha=k*0.6;
  ctx.fillStyle=t.c;
  ctx.beginPath();ctx.arc(t.wx-camX,t.wy-camY,6*k,0,6.28);ctx.fill();
 }
 ctx.globalAlpha=1;
}
function objectsDraw(){
 const gy=GY-camY;
 for(const o of objects){
  const sx=o.x-camX;
  if(sx<-100||sx>W+100)continue;
  if(o.id==5){drawTree(sx,gy);continue;}
  drawEmoji(EMOJI[o.id],sx,o.ground?gy-22:o.y-camY,50.6);
 }
}
function drawTree(sx,gy){
 ctx.fillStyle='#643A45';ctx.fillRect(sx-20.5,gy-220,40,220);
 drawEmoji('🌳',sx,gy-250,280,280);
}
function unicornDraw(){
 ctx.save();
 ctx.translate(200,uwy-camY);
 ctx.rotate((phase=='run'?Math.sin(bob)*0.06:theta)+0.3);
 ctx.scale(1.4,1.4);
 drawEmoji('🦄',0,0,48);
 ctx.restore();
}
function partsDraw(){
 ctx.fillStyle='#fff';
 for(const p of parts){
  ctx.globalAlpha=1-(p.wy-camY)/H;
  ctx.beginPath();ctx.arc(p.wx-camX,p.wy-camY,p.r,0,6.28);ctx.fill();
 }
 ctx.globalAlpha=1;
}
function hud(){
 const F='bold 26px "Segoe UI",system-ui,sans-serif';
 ctx.textBaseline='top';
 if(phase=='run'){
  ctx.textAlign='center';ctx.font=F;
  ctx.fillStyle='rgba(255,255,255,.95)';
  ctx.fillText("One Flew Over the Unicorn's forest",W/2,H*0.32);
 }
 ctx.textAlign='left';ctx.font=F;
 ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=6;
 ctx.fillText(score,16,10);
 ctx.shadowBlur=0;
 ctx.font='13px "Segoe UI",system-ui,sans-serif';
 ctx.fillStyle='rgba(255,255,255,.75)';
 ctx.fillText((uwx/40|0)+' m',16,42);
 const frac=Math.max(0,energy/100);
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(14,58,214,17);
 if(frac>0.01){ctx.fillStyle='#FF794B';ctx.fillRect(16,60,210*frac,13);}
 if(frac<0.22&&Math.sin(gameTime*10)>0){ctx.strokeStyle='#ff5252';ctx.lineWidth=2;ctx.strokeRect(14,58,214,17);}
}
function showOverlay(){
 const E=i=>document.getElementById(i);
 E('scoreval').textContent=score;
 E('distval').textContent=(uwx/40|0)+'m';
 let h='';
 for(const[k,n]of Object.entries(collected).sort((a,b)=>b[1]-a[1]))
  h+='<div class=stat><div class=stat-emoji>'+EMOJI[+k]+'</div><div class=stat-count>×'+n+'</div></div>';
 E('stats').innerHTML=h;
 E('overlay').classList.remove('hidden');
}
function pressStart(){
 C?.state=='suspended'&&C.resume();
 if(phase=='dead'){if(gameTime-deathAt>0.9)reset();return;}
 if(phase=='run')takeoff();
 holding=true;
}
function pressEnd(){holdT=holding=0;}
addEventListener('keydown',e=>{
 if(e.repeat)return;
 if(e.code=='Space')e.preventDefault();
 pressStart();
});
addEventListener('keyup',()=>pressEnd());
addEventListener('pointerdown',()=>pressStart());
addEventListener('pointerup',()=>pressEnd());
addEventListener('pointercancel',()=>pressEnd());
addEventListener('pointerleave',()=>pressEnd());
function reset(){
 phase='run';
 uwx=genX=theta=v=vy=bob=holdT=launchBoost=distAcc=score=gameTime=0;
 uwy=2376;camX=-200;camY=1924;
 holding=false;energy=100;rainbowChance=1;
 collected={};objects=[];parts=[];trail=[];
 initTracks();
 interScanX=40;
 overlay.classList.add('hidden');
}
function fit(){
 const s=Math.min(innerWidth/W,innerHeight/H)*0.98;
 cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
addEventListener('resize',fit);fit();
initSprites();
loadUnicorn().then(reset);
let last=performance.now();
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min((now-last)/1000,0.033);last=now;
 update(dt);draw();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Flew Over the Unicorn's forest</title>
<style>
html,body{margin:0;height:100%;background:#050816;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:system-ui;color:#fff;user-select:none}
#stage{position:relative}
canvas{display:block;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,8,20,.72)}
#overlay.hidden{opacity:0;pointer-events:none}
.panel{background:rgba(10,16,40,.93);padding:20px;text-align:center;overflow:auto}
#scoreval{font-size:56px;font-weight:800;color:#ffd75e}
.sub{font-size:22px;color:#cfd6ff;margin:6px 0 14px}
#stats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.stat{padding:8px 10px}
.stat-emoji{font-size:44px}
.stat-count{font-weight:800;font-size:17px;color:#ffd75e}
#hint{color:#8fa0e8;font-size:14px;margin-top:16px}
</style>
</head>
<body>
<div id="stage">
<canvas id="game" width="960" height="540"></canvas>
<div id="overlay" class="hidden">
<div class="panel">
<div id="scoreval">0</div>
<div id="distval" class="sub"></div>
<div id="stats"></div>
<div id="hint">Press any key</div>
</div>
</div>
</div>
<script>
'use strict';

// ============================================
// INITIALIZATION
// ============================================
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width;
const H = cv.height;

const EMOJI_FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

// World constants
const GY = 2400;           // Ground Y position
const OBJ_TOP = 420;       // Top boundary for objects
const CAM_MAX_Y = GY - (H - 64);
const UNI_X = 200;         // Unicorn X position on screen
const AIR_FLOOR = GY - 450;
const MAX_ENERGY = 100;

// Object IDs
const ID_RAINBOW = 15;
const ID_CORN = 17;

// Emoji definitions
const EMOJI = ['🐦','🪶','🌾','🦋','🐝','🌳','☁️','🫧','🪵','✨','🎈','🍄','🪁','🦟','🍇','🌈','️🌩️','🌽','🌠'];
const N = EMOJI.length;

// Object properties
const isGround = [];
const weight = [];
const points = [];
for (let id = 0; id < N; id++) {
  isGround[id] = (id % 3 === 2);
  weight[id] = id % 4 + 1;
  points[id] = 50 + 10 * weight[id] + 50 * id;
}
weight[18] = 1;

// Object pools
const airPool = [];
const groundPool = [];
for (let id = 0; id < N; id++) {
  if (!isGround[id] && id !== ID_RAINBOW) airPool.push(id);
  else if (isGround[id] && id !== ID_CORN) groundPool.push(id);
}
const airPoolNoStar = airPool.filter(id => id !== 18);

// Rainbow colors for trail
const RAINBOW = ['#ff5252','#ff9f43','#ffe14d','#63e06b','#4dc3ff','#7a6bff','#d75dff'];

// ============================================
// GAME STATE
// ============================================
let phase = 'run';  // 'run', 'fly', 'dead'

// Player position and movement
let uwx = 0;                    // Unicorn world X
let uwy = GY - 24;              // Unicorn world Y
let camX = -UNI_X;              // Camera X
let camY = CAM_MAX_Y;           // Camera Y

// Physics
let theta = 0;                  // Flight angle
let v = 0;                      // Velocity
let vy = 0;                     // Vertical velocity (when dead)
let bob = 0;                    // Bobbing animation

// Input state
let holding = false;
let holdT = 0;

// Game mechanics
let launchBoost = 0;
let distAcc = 0;                // Distance accumulator for scoring
let energy = MAX_ENERGY;
let score = 0;

// Timing and events
let gameTime = 0;
let deathAt = 0;
let collected = {};

// World objects
let objects = [];
let parts = [];                 // Particle effects
let trail = [];                 // Rainbow trail
let tracks = [];                // Procedural tracks
let interScanX = 0;
let genX = 0;                   // Generation frontier
let shake = 0;
let rainbowChance = 1;

// ============================================
// UTILITY FUNCTIONS
// ============================================
const rand = (a, b) => a + Math.random() * (b - a);

function hashRand(n) {
  return Math.abs(Math.sin(n * 127.1 + 311.7)) * 43758.5453 % 1;
}

const clampY = y => Math.min(Math.max(y, OBJ_TOP + 24), AIR_FLOOR);

// ============================================
// SPRITE MANAGEMENT
// ============================================
const sprites = {};

function getSprite(ch, tint, S) {
  S = S || 64;
  const key = ch + S + (tint || '');
  if (sprites[key]) return sprites[key];
  
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  
  g.font = S * 0.9 + 'px ' + EMOJI_FONT;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(ch, S / 2, S / 2);
  
  if (tint) {
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = tint;
    g.fillRect(0, 0, S, S);
  }
  
  return sprites[key] = c;
}

function drawEmoji(ch, x, y, s, S, tint) {
  ctx.drawImage(getSprite(ch, tint, S), x - s / 2, y - s / 2, s, s);
}

function initSprites() {
  for (let id = 0; id < N; id++) {
    if (id !== 5) getSprite(EMOJI[id]);
  }
  getSprite('🌳', 0, 280);
  getSprite('☁️', '#ff8cc8cc', 280);
}

// ============================================
// UNICORN SVG SPRITE
// ============================================
const UNICORN_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1104 916">
<path fill="#CD7ED5" d="m1013 155-16 46 55-6-18 51-23 12c3.333 8-36.833 25.81-33.5 33.81 8 11.333 77.753 193.73 64.38 201l-97.32 5.25-44.77-16.18-40.85-12.04-12.88 30.47.05 27.2 33.14 23.93 133.5 52.81 23.13 20.44 24.18 24.97L1075 679l-59.06 33.06-22.06-13.94-52.19 49.69L912 749l-25-24-30.52-24.81L812 683l-45.31-8.94L692 723l-146 24-67.71 63.91L449 820l-35 62-42 25-36-42-21 21-39.81 26.06L249 897l-15-44 18-24 35-84 33.74-95.16L330 598l-88.29 120.18L228 740l-38 41-112-5-54-59 83.44-7.81L51 689l-29-53 13-83 22.5 52.69L161 517l23-26 116.5-21.94L373 527l115-32-68-32-91.94-31.81-24.31 10.06L303 409l54.12-36.81L386 370l-49.56-10.5-61.78 28.34-46.54 4.04-30.5-20.82-4.31-39L224 352l30-4 22-32 19.81-24.19 74.91-25.22L402 271l-7-68 75.44 34.5L530 213l34-44 26-32 37-36 145-50 73 26 32.19-5.12L918 83l24 41"/>
<path fill="#ECEFF7" d="m760.63 75.5 55 81v27l64 36 100.88 44.19 93.12 101.81 18 57-29.94 59-39.12 7.62-51.94-37.62 51 42-35 12-51-12-27-9-31.5-11.94-43.5-8.06-41-21-33-54 41 64 35 16-9 119-34-12 31 16 129 76-47 31-19 23-45.62-33.19-94.38-22.81-33-13 29 16-27 31-221 38-3-37-15 34-15.87 22.62-112.13 48.38-44 82-50-50 33.76-82.53 34.98-101.63 7.26-43.84 26-49 18-21 34-19 25-8 26-8 29-2 29-4 25-7 27.62-13.63 31.13-25.81 33.25-27.56 52.33-102.2.55-27.92 31.62-86.69 23.5 12.81-12.75-105.69zl121 229"/>
<path fill="#e2d5f5" d="m841 550 35.56 6.04 26.69 6.15L1017 615l21 20-55 48-27-23-78-53-24.44-11.38-15.5-28.37z"/>
<path fill="#d9b6f4" d="m482 738 54 7-87 69-42 66-47-44 9.92-25.55z"/>
<path fill="#0d0d0d" d="m888.44 290.94 21.31 25-7.63 25.81-41.37 6.19-14-32zl-8.69 25 3-13"/>
<path fill="#F8CA2F" d="M1000 185.5s-49.667-39.333-53-49c5-7.333 148-131.167 153-138.5 6-2-100 187.5-100 187.5"/>
</svg>`;

function loadUnicorn() {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      c.getContext('2d').drawImage(img, 0, 0, 64, 64);
      sprites['🦄64'] = c;
      res();
    };
    img.src = 'data:image/svg+xml,' + encodeURIComponent(UNICORN_SVG);
  });
}

// ============================================
// VISUAL EFFECTS
// ============================================
function skyColor(t) {
  t = Math.min(1, Math.max(0, t));
  const u = 1 - t;
  const a = u * u;
  const b = 2 * u * t;
  
  return 'rgb(' +
    (6 + a * 162 + b * 34 | 0) + ',' +
    (10 + a * 210 + b * 100 | 0) + ',' +
    (36 + a * 209 + b * 184 | 0) + ')';
}

function makeTrack(i) {
  return {
    baseCenter: 778 + 216 * i + rand(-90, 90),
    centerA: rand(180, 380),
    centerP: rand(0, 6.28),
    baseAmp: rand(120, 280),
    ampP: rand(0, 6.28),
    baseW: rand(0.0025, 0.005),
    p0: rand(0, 6.28),
    genX: camX + 240 + i * 40
  };
}

function initTracks() {
  tracks = [];
  for (let i = 0; i < 5; i++) {
    tracks.push(makeTrack(i));
  }
}

function trackY(tr, x) {
  return clampY(
    tr.baseCenter +
    tr.centerA * Math.sin(x * 0.0007 + tr.centerP) +
    tr.baseAmp * (0.55 + 0.45 * Math.sin(x * 0.001 + tr.ampP)) *
    Math.sin(x * tr.baseW + tr.p0)
  );
}

function near(x, y, r, f) {
  return objects.some(o =>
    f(o) &&
    Math.abs(o.x - x) < r &&
    (y === null || Math.abs(o.y - y) < r)
  );
}

function pickId(pool) {
  let s = 0;
  for (const id of pool) s += weight[id];
  
  let r = Math.random() * s;
  for (const id of pool) {
    r -= weight[id];
    if (r <= 0) return id;
  }
}

function pickAir(y) {
  return pickId(y < 670 ? airPool : airPoolNoStar);
}

// ============================================
// WORLD GENERATION
// ============================================
function ensureWorld() {
  const end = camX + W + 600;
  const g = camX + W * 0.3;
  
  // Generate objects on tracks
  for (const tr of tracks) {
    while (tr.genX < end) {
      const x = tr.genX;
      tr.genX += 360;
      const y = trackY(tr, x);
      
      if (y < 450 || near(x, y, 80, o => !o.ground)) continue;
      objects.push({ id: pickAir(y), x, y, ground: false });
    }
  }
  
  spawnIntersections();
  
  // Generate ground objects
  if (genX < g) genX = g + rand(0, 200);
  while (genX < end) {
    if (Math.random() < 0.18) {
      spawnCornField(genX);
      continue;
    }
    
    genX += 300 * rand(0.8, 1.35);
    if (!near(genX, null, 170, o => o.ground)) {
      objects.push({ id: pickId(groundPool), x: genX, y: 2400, ground: true });
    }
  }
}

function spawnIntersections() {
  const T = tracks;
  const n = T.length;
  const target = camX + W + 600;
  
  if (interScanX < camX - 100) interScanX = camX - 100;
  
  for (let x = interScanX; x <= target; x += 14) {
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const a = trackY(T[i], x) - trackY(T[j], x);
        const b = trackY(T[i], x + 14) - trackY(T[j], x + 14);
        
        if (a * b < 0) {
          const xi = x + 7;
          const yi = (trackY(T[i], xi) + trackY(T[j], xi)) / 2;
          
          if (yi > 450 && yi <= 1950 && Math.random() < rainbowChance && !near(xi, yi, 160, o => o.id === 15)) {
            objects.push({ id: 15, x: xi, y: yi, ground: false });
          }
        }
      }
    }
  }
  
  interScanX = target;
}

function spawnCornField(x0) {
  const count = 6 + Math.random() * 5 | 0;
  for (let i = 0; i < count; i++) {
    objects.push({ id: 17, x: x0 + i * 58, y: 2400, ground: true });
  }
  genX = x0 + count * 58 + 260;
}

// ============================================
// GAME MECHANICS
// ============================================
function collect(id) {
  score += points[id];
  collected[id] = (collected[id] || 0) + 1;
  theta = Math.max(-1.15, theta - 0.03);
  launchBoost = Math.min(launchBoost + 300, 600);
}

function die() {
  if (phase !== 'fly') return;
  
  phase = 'dead';
  deathAt = gameTime;
  holdT = holding = 0;
  vy = Math.max(vy, 80);
  shake = 9;
  
  setTimeout(() => phase === 'dead' && showOverlay(), 700);
}

function takeoff() {
  phase = 'fly';
  theta = -0.55;
  v = 552;
  vy = holdT = 0;
  launchBoost = 800;
  burstWorld(uwx, uwy);
}

function followCam(dt) {
  camX = uwx - 200;
  camY += (Math.max(-260, Math.min(1924, uwy - 297)) - camY) * Math.min(1, dt * 6);
}

// ============================================
// UPDATE LOOP
// ============================================
function update(dt) {
  gameTime += dt;
  shake = Math.max(0, shake - 26 * dt);
  updateFx(dt);
  
  if (phase === 'run') {
    // Running on ground
    uwx += 360 * dt;
    bob += dt * 11;
    uwy = 2376 + Math.sin(bob) * 2.2;
    camX = uwx - 200;
    camY = 1924;
    ensureWorld();
    
  } else if (phase === 'dead') {
    // Falling animation
    if (uwy < 2376) {
      vy += 820 * dt;
      uwy += vy * dt;
      theta += 4 * dt;
    } else {
      uwy = 2376;
    }
    followCam(dt);
    
  } else {
    // Flying
    theta += 0.1 * dt;
    
    if (holding && energy > 0) {
      holdT += dt;
      theta -= 0.62 * (2 + Math.min(holdT / 1.2, 1)) * dt;
      energy = Math.max(0, energy - 11 * dt);
    } else {
      holdT = 0;
    }
    
    theta = Math.min(1.25, Math.max(-1.15, theta));
    
    const s = Math.sin(theta);
    const vT = Math.max(60, 480 + 456 * s);
    v = Math.min(820, v + (vT - v) * Math.min(1, (vT > v ? 2.8 : 0.8) * dt));
    
    const dxm = v * Math.cos(theta) * dt;
    uwx += dxm;
    uwy += (v * s - launchBoost) * dt;
    launchBoost = Math.max(0, launchBoost - 600 * dt);
    
    distAcc += dxm * 0.025;
    distAcc >= 1 && (score += distAcc | 0, distAcc %= 1);
    
    if (uwy < 60) uwy = 60;
    
    followCam(dt);
    trail.push({ wx: uwx, wy: uwy + 8, c: RAINBOW[gameTime * 14 % 7 | 0] });
    ensureWorld();
    collisions();
    
    phase === 'fly' && uwy >= 2380 && die();
  }
  
  cull();
}

// ============================================
// COLLISION DETECTION
// ============================================
function collisions() {
  for (const o of objects) {
    if (o.dead) continue;
    
    const dx = o.x - uwx;
    if (dx < -120 || dx > 120) continue;
    
    const id = o.id;
    const d2 = dx * dx;
    
    // Tree collision
    if (id === 5) {
      if (dx > -33 && dx < 33 && uwy > 2250) {
        die();
        return;
      }
      if (!o.hit && d2 + (uwy - 2150) ** 2 < 13225) {
        o.hit = true;
        collect(5);
        v *= 0.9;
        burstWorld(o.x, 2150);
      }
      continue;
    }
    
    // Mushroom collision
    if (id === 11) {
      if (dx > -66 && dx < 66 && uwy > 2305 && uwy < 2420) {
        o.dead = true;
        collect(11);
        theta = -0.5;
        launchBoost = Math.max(launchBoost, 500);
        uwy = 2370;
        burstWorld(o.x, 2370);
      }
      continue;
    }
    
    // General collision
    const oy = o.ground ? 2378 : o.y;
    const dy = oy - uwy;
    if (d2 + dy * dy > 1764) continue;
    
    if (id === 8) {
      die();
      return;
    }
    
    o.dead = true;
    burstWorld(o.x, oy);
    
    if (id === 15) {
      // Rainbow
      collect(15);
      score -= 840;
      energy = Math.min(100, energy + 50);
      rainbowChance *= 0.7;
    } else {
      collect(id);
      if (id === 16) launchBoost = Math.max(launchBoost, 800);
    }
  }
}

function cull() {
  objects = objects.filter(o => !o.dead && o.x > camX - 160);
}

function updateFx(dt) {
  trail = trail.filter(t => uwx - t.wx < 250 && t.wx - camX > -40);
  parts = parts.filter(p => {
    p.wy += p.vy * dt;
    return p.wy - camY < H && p.wx - camX > -40;
  });
}

function burstWorld(wx, wy) {
  for (let i = 8; i--;) {
    parts.push({
      wx: wx + rand(-14, 14),
      wy: wy + rand(-8, 8),
      vy: rand(50, 120),
      r: rand(2, 4)
    });
  }
}

// ============================================
// RENDERING
// ============================================
function scenery() {
  const gy = GY - camY;
  const coff = camX * 0.5;
  let i0 = Math.floor((coff - 300) / 380);
  let i1 = Math.ceil((coff + W + 300) / 380);
  
  // Clouds
  ctx.globalAlpha = 0.5;
  for (let i = i0; i <= i1; i++) {
    if (hashRand(i + 50) < 0.2) continue;
    const sy = 520 + hashRand(i + 101) * 1580 - camY;
    if (sy < -350 || sy > H + 350) continue;
    drawEmoji('☁️', i * 380 - coff + hashRand(i) * 260, sy, 110 + hashRand(i + 202) * 230, 280, 'rgba(255,140,200,0.8)');
  }
  
  // Trees
  if (gy > -200 && gy < H + 300) {
    const off = camX * 0.22;
    i0 = Math.floor((off - 300) / 260);
    i1 = Math.ceil((off + W + 300) / 260);
    ctx.globalAlpha = 0.65;
    for (let i = i0; i <= i1; i++) {
      const s = 130 * (0.6 + hashRand(i + 7) * 0.8);
      drawEmoji('🌳', i * 260 - off + hashRand(i + 11) * 156, gy - s * 0.4, s, 280);
    }
  }
  
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.save();
  ctx.translate(rand(-shake, shake), rand(-shake, shake));
  
  sky();
  scenery();
  ground();
  trailDraw();
  objectsDraw();
  unicornDraw();
  partsDraw();
  
  ctx.restore();
  hud();
}

function sky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  for (let i = 0; i <= 4; i++) {
    g.addColorStop(i / 4, skyColor((GY - camY - H * i / 4) / 2660));
  }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  
  const sa = Math.min(1, Math.max(0, ((GY - camY - 270) / 2660 - 0.35) / 0.4));
  if (sa > 0.01) {
    ctx.fillStyle = '#cfe2ff';
    for (let i = 0; i < 70; i++) {
      ctx.globalAlpha = sa * (0.25 + 0.5 * hashRand(i + 200));
      ctx.fillRect(hashRand(i) * W, hashRand(i + 100) * 324, 1.6, 1.6);
    }
  }
  ctx.globalAlpha = 1;
}

function ground() {
  const gy = GY - camY;
  if (gy > H + 10) return;
  
  const g = ctx.createLinearGradient(0, gy, 0, gy + 80);
  g.addColorStop(0, '#3f9d4e');
  g.addColorStop(1, '#2a6e38');
  ctx.fillStyle = g;
  ctx.fillRect(0, gy, W, H - gy + 50);
  
  ctx.fillStyle = '#57c264';
  ctx.fillRect(0, gy, W, 5);
  
  ctx.strokeStyle = '#2f7d3c';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const i0 = Math.floor(camX / 26);
  for (let i = -1; i < W / 26 + 2; i++) {
    const idx = i0 + i;
    const sx = idx * 26 - camX;
    ctx.moveTo(sx, gy + 8);
    ctx.lineTo(sx + 3, gy + 5 - (Math.abs(idx * 3) % 7));
  }
  ctx.stroke();
}

function trailDraw() {
  for (const t of trail) {
    const k = 1 - (uwx - t.wx) / 250;
    if (k <= 0) continue;
    
    ctx.globalAlpha = k * 0.6;
    ctx.fillStyle = t.c;
    ctx.beginPath();
    ctx.arc(t.wx - camX, t.wy - camY, 6 * k, 0, 6.28);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function objectsDraw() {
  const gy = GY - camY;
  for (const o of objects) {
    const sx = o.x - camX;
    if (sx < -100 || sx > W + 100) continue;
    
    if (o.id === 5) {
      drawTree(sx, gy);
      continue;
    }
    
    drawEmoji(EMOJI[o.id], sx, o.ground ? gy - 22 : o.y - camY, 50.6);
  }
}

function drawTree(sx, gy) {
  ctx.fillStyle = '#643A45';
  ctx.fillRect(sx - 20.5, gy - 220, 40, 220);
  drawEmoji('🌳', sx, gy - 250, 280, 280);
}

function unicornDraw() {
  ctx.save();
  ctx.translate(200, uwy - camY);
  ctx.rotate((phase === 'run' ? Math.sin(bob) * 0.06 : theta) + 0.3);
  ctx.scale(1.4, 1.4);
  drawEmoji('🦄', 0, 0, 48);
  ctx.restore();
}

function partsDraw() {
  ctx.fillStyle = '#fff';
  for (const p of parts) {
    ctx.globalAlpha = 1 - (p.wy - camY) / H;
    ctx.beginPath();
    ctx.arc(p.wx - camX, p.wy - camY, p.r, 0, 6.28);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function hud() {
  const F = 'bold 26px "Segoe UI",system-ui,sans-serif';
  ctx.textBaseline = 'top';
  
  if (phase === 'run') {
    ctx.textAlign = 'center';
    ctx.font = F;
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.fillText("One Flew Over the Unicorn's forest", W / 2, H * 0.32);
  }
  
  ctx.textAlign = 'left';
  ctx.font = F;
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,0,0,.5)';
  ctx.shadowBlur = 6;
  ctx.fillText(score, 16, 10);
  ctx.shadowBlur = 0;
  
  ctx.font = '13px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText((uwx / 40 | 0) + ' m', 16, 42);
  
  const frac = Math.max(0, energy / 100);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(14, 58, 214, 17);
  
  if (frac > 0.01) {
    ctx.fillStyle = '#FF794B';
    ctx.fillRect(16, 60, 210 * frac, 13);
  }
  
  if (frac < 0.22 && Math.sin(gameTime * 10) > 0) {
    ctx.strokeStyle = '#ff5252';
    ctx.lineWidth = 2;
    ctx.strokeRect(14, 58, 214, 17);
  }
}

// ============================================
// INPUT HANDLING
// ============================================
function pressStart() {
  C?.state === 'suspended' && C.resume();
  
  if (phase === 'dead') {
    if (gameTime - deathAt > 0.9) reset();
    return;
  }
  
  if (phase === 'run') takeoff();
  holding = true;
}

function pressEnd() {
  holdT = holding = 0;
}

addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space') e.preventDefault();
  pressStart();
});

addEventListener('keyup', () => pressEnd());
addEventListener('pointerdown', () => pressStart());
addEventListener('pointerup', () => pressEnd());
addEventListener('pointercancel', () => pressEnd());
addEventListener('pointerleave', () => pressEnd());

  cv.style.height = H * s + 'px';
}

}

let C;
let songBytes;
let bitIndex;

const SAT_DRIVE = 2.5;
const TWO_PI = 6.28318;
const ENV_ATTACK = 0.003;
const ENV_DECAY = 0.08;
const ENV_SUSTAIN = 0.35;
const ENV_RELEASE = 0.12;
const WAH_START = 8500;
const WAH_END = 350;
const WAH_SPEED = 0.05;
const DRUM_AMP = 1.0;
const DRUM_DECAY_RATE = 5;

const readBit = () => {
  if (bitIndex >= songBytes.length * 8) return 0;
  const byteIndex = bitIndex >> 3;
  const bitOffset = 7 - (bitIndex % 8);
  bitIndex++;
  return (songBytes[byteIndex] >> bitOffset) & 1;
};

const readBits = (numBits) => {
  let value = 0;
  for (let i = 0; i < numBits; i++) {
    value = (value << 1) | readBit();
  }
  return value;
};

const readVarInt = () => {
  let zeroCount = 0;
  while (!readBit()) {
    if (++zeroCount > 31 || bitIndex >= songBytes.length * 8) return 0;
  }
  let value = 1;
  for (let i = 0; i < zeroCount; i++) {
    value = (value << 1) | readBit();
  }
  return value - 1;
};

const decodeSong = (bytes) => {
  songBytes = bytes;
  bitIndex = 0;
  
  const magic = String.fromCharCode(readBits(8), readBits(8), readBits(8), readBits(8));
  if (magic !== "OSCB") throw new Error("Invalid format");
  
  readBits(8);
  const tempoMultiplier = readBits(8) / 1000;
  const totalDuration = readBits(32) * tempoMultiplier;
  const instrumentCount = readBits(16);
  const bitsPerInstId = Math.max(1, Math.ceil(Math.log2(instrumentCount)));
  
  const instruments = [];
  for (let i = 0; i < instrumentCount; i++) {
    instruments.push({
      wave: readBits(2),
      note: readBits(7),
      vel: readBits(4),
      dec: readVarInt()
    });
  }
  
  const eventCount = readBits(32);
  const events = [];
  let currentTime = 0;
  
  for (let i = 0; i < eventCount; i++) {
    const instId = readBits(bitsPerInstId);
    if (instId >= instrumentCount) break;
    
    const inst = instruments[instId];
    currentTime += readVarInt();
    
    events.push({
      time: currentTime * tempoMultiplier,
      wave: inst.wave,
      freq: 440 * Math.pow(2, (inst.note - 69) / 12),
      amp: (inst.vel + 1) / 16,
      dur: inst.dec * tempoMultiplier
    });
  }
  
  return { duration: totalDuration, events };
};

const generateSaw = (phase) => {
  return 2 * ((phase / TWO_PI) - Math.floor((phase / TWO_PI) + 0.5));
};

const applyLowPassFilter = (buffer, sampleRate, cutoffFreq, q) => {
  if (cutoffFreq <= 0) return;
  
  const w = TWO_PI * cutoffFreq / sampleRate;
  const cw = Math.cos(w);
  const sw = Math.sin(w);
  const al = sw / (2 * q);
  
  const b0 = (1 - cw) / 2;
  const b1 = 1 - cw;
  const b2 = b0;
  const a0 = 1 + al;
  const a1 = -2 * cw;
  const a2 = 1 - al;
  
  let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  
  for (let i = 0; i < buffer.length; i++) {
    const x0 = buffer[i];
    const y0 = (b0 * x0 + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2) / a0;
    x2 = x1;
    x1 = x0;
    y2 = y1;
    y1 = y0;
    buffer[i] = y0;
  }
};

const applyHighPassFilter = (buffer, sampleRate, cutoffFreq) => {
  if (cutoffFreq <= 0) return;
  
  const w = TWO_PI * cutoffFreq / sampleRate;
  const cw = Math.cos(w);
  const sw = Math.sin(w);
  const al = sw / 2;
  
  const b0 = (1 + cw) / 2;
  const b1 = -(1 + cw);
  const b2 = b0;
  const a0 = 1 + al;
  const a1 = -2 * cw;
  const a2 = 1 - al;
  
  let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  
  for (let i = 0; i < buffer.length; i++) {
    const x0 = buffer[i];
    const y0 = (b0 * x0 + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2) / a0;
    x2 = x1;
    x1 = x0;
    y2 = y1;
    y1 = y0;
    buffer[i] = y0;
  }
};

const applyDistortion = (buffer, drive) => {
  for (let i = 0; i < buffer.length; i++) {
    let v = buffer[i] * drive;
    if (v > 1) v = 1 + (v - 1) * 0.15;
    else if (v < -1) v = -1 + (v + 1) * 0.15;
    buffer[i] = v;
  }
};

const renderAudio = (song) => {
  const sampleRate = 22050;
  const maxDurationSec = 3600;
  const bufferLength = (Math.min(Math.max(song.duration, 0), maxDurationSec) + 0.2) * sampleRate | 0;
  const outputBuffer = new Float32Array(bufferLength);
  const DETUNE_AMOUNTS = [-0.015, -0.008, -0.003, 0.003, 0.008, 0.015];

  for (const event of song.events) {
    if (event.wave === 2) continue;
    
    const startSample = (event.time * sampleRate) | 0;
    const maxSamples = Math.min(bufferLength - startSample, (event.dur * sampleRate) | 0, sampleRate * 10);
    if (maxSamples < 1) continue;
    
    const phaseIncrement = TWO_PI * event.freq / sampleRate;
    const phaseIncrementOct = phaseIncrement * 2;
    
    const attackLen = Math.min((sampleRate * ENV_ATTACK) | 0, maxSamples >> 2);
    const decayLen = Math.min((sampleRate * ENV_DECAY) | 0, maxSamples >> 2);
    const releaseLen = Math.min((sampleRate * ENV_RELEASE) | 0, maxSamples >> 1);
    const sustainLen = Math.max(0, maxSamples - attackLen - decayLen - releaseLen);
    
    let phase = (Math.sin(event.time * 12.9898) * 43758.5453) % TWO_PI;
    if (phase < 0) phase += TWO_PI;
    let phaseOct = phase;
    let filterY = 0;
    
    const wahDecaySamples = sampleRate * WAH_SPEED;

    for (let i = 0; i < maxSamples; i++) {
      let v = 0;
      
      for (let d = 0; d < 6; d++) {
        v += generateSaw(phase * (1 + DETUNE_AMOUNTS[d]));
      }
      v /= 6;
      v += generateSaw(phase) * 0.5;
      v += generateSaw(phaseOct) * 0.3;
      
      phase += phaseIncrement;
      if (phase > TWO_PI) phase -= TWO_PI;
      phaseOct += phaseIncrementOct;
      if (phaseOct > TWO_PI) phaseOct -= TWO_PI;
      
      const currentCutoff = WAH_END + (WAH_START - WAH_END) * Math.exp(-i / wahDecaySamples);
      const alpha = 1 - Math.exp(-TWO_PI * currentCutoff / sampleRate);
      filterY += alpha * (v - filterY);
      v = filterY;
      
      let env = 0;
      if (i < attackLen) {
        env = i / attackLen;
      } else if (i < attackLen + decayLen) {
        env = 1 - (1 - ENV_SUSTAIN) * (i - attackLen) / decayLen;
      } else if (i < attackLen + decayLen + sustainLen) {
        env = ENV_SUSTAIN;
      } else {
        env = ENV_SUSTAIN * (1 - (i - attackLen - decayLen - sustainLen) / releaseLen);
      }
      
      outputBuffer[startSample + i] += v * env * event.amp;
    }
  }

  applyDistortion(outputBuffer, SAT_DRIVE);
  applyLowPassFilter(outputBuffer, sampleRate, 7500, 0.6);
  applyHighPassFilter(outputBuffer, sampleRate, 40);

  let maxPeak = 0;
  for (let i = 0; i < bufferLength; i++) {
    const absVal = Math.abs(outputBuffer[i]);
    if (absVal > maxPeak) maxPeak = absVal;
  }
  
  if (maxPeak > 0) {
    const gain = 0.85 / maxPeak;
    for (let i = 0; i < bufferLength; i++) {
      let x = outputBuffer[i] * gain;
      if (x > 1) x = 1;
      if (x < -1) x = -1;
      outputBuffer[i] = x;
    }
  }

  for (const event of song.events) {
    if (event.wave !== 2) continue;
    
    const startSample = (event.time * sampleRate) | 0;
    const maxSamples = Math.min(bufferLength - startSample, (event.dur * sampleRate) | 0, sampleRate * 10);
    if (maxSamples < 1) continue;
    
    for (let i = 0; i < maxSamples; i++) {
      const env = Math.exp(-DRUM_DECAY_RATE * i / maxSamples);
      const noise = (Math.random() * 2 - 1) * env * event.amp * DRUM_AMP;
      let mixed = outputBuffer[startSample + i] + noise;
      if (mixed > 1) mixed = 1;
      if (mixed < -1) mixed = -1;
      outputBuffer[startSample + i] = mixed;
    }
  }
  
  return { sampleRate, buffer: outputBuffer };
};

const playSong = async (songData) => {
  const rendered = renderAudio(songData);
  C = new AudioContext();
  await C.resume();
  
  const audioBuffer = C.createBuffer(1, rendered.buffer.length, rendered.sampleRate);
  audioBuffer.copyToChannel(rendered.buffer, 0);
  
  const source = C.createBufferSource();
  source.buffer = audioBuffer;
  source.loop = true;
  source.connect(C.destination);
  source.start();
};

const base64ToUint8Array = (base64String) => {
  const binaryString = atob(base64String);
  const bytes = new Uint8Array(binaryString.length);
  for (let i = 0; i < binaryString.length; i++) {
    bytes[i] = binaryString.charCodeAt(i);
  }
  return bytes;
};

(async () => {
  if (typeof E !== 'undefined') {
    const songData = decodeSong(base64ToUint8Array(E));
    await playSong(songData);
  }
})();

["click", "keydown", "touchend"].forEach(eventType => {
  addEventListener(eventType, () => {
    if (C && C.state === "suspended") {
      C.resume();
    }
  });
});
